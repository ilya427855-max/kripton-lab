<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KRIPTON LAB — Chat Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Индикатор подключения в углу */
        #status-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444; /* По умолчанию красный */
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
            transition: all 0.3s ease;
        }
        #status-dot.online {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 480px;
        }

        .chat-msg {
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-left: 3px solid #00f0ff;
            border-radius: 8px;
            padding: 10px 14px;
            color: #f1f5f9;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 240, 255, 0.08);
            backdrop-filter: blur(6px);
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .chat-msg.fade-out {
            opacity: 0;
            transform: translateX(-20px);
        }

        .msg-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .chip-lvl {
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 10px;
        }

        .chip-badge {
            background: rgba(245, 158, 11, 0.18);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.45);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 10px;
        }

        .chip-title {
            background: rgba(168, 85, 247, 0.18);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .user-name {
            font-weight: 700;
            font-size: 13px;
        }

        .msg-text {
            word-break: break-word;
            color: #e2e8f0;
            font-size: 13px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div id="status-dot" title="Статус WebSocket"></div>
<div id="chat-container"></div>

<script>
    const WS_URL = "ws://127.0.0.1:8080/";
    const MAX_MESSAGES = 8;
    const MESSAGE_LIFETIME = 20000;

    const container = document.getElementById('chat-container');
    const dot = document.getElementById('status-dot');
    let ws = null;

    function connect() {
        ws = new WebSocket(WS_URL);

        ws.onopen = function () {
            dot.classList.add('online');
            dot.title = "WebSocket активен";
        };

        ws.onmessage = function (e) {
            try {
                const data = JSON.parse(e.data);
                if (data.event === "LAB_CHAT") {
                    addMessage(data);
                }
            } catch (err) {}
        };

        ws.onclose = function () {
            dot.classList.remove('online');
            dot.title = "WebSocket отключен";
            setTimeout(connect, 2500);
        };

        ws.onerror = function () {
            ws.close();
        };
    }

    function addMessage(data) {
        const msgEl = document.createElement('div');
        msgEl.className = 'chat-msg';

        let badgesHtml = '';
        if (data.isMod) badgesHtml += '<span title="Модератор">🛡️</span>';
        if (data.isSub) badgesHtml += '<span title="Подписчик">⭐</span>';
        badgesHtml += `<span class="chip-lvl">УР.${data.level}</span>`;

        if (data.badge && data.badge.trim() !== '') {
            badgesHtml += `<span class="chip-badge">[${escapeHtml(data.badge)}]</span>`;
        }
        if (data.title && data.title.trim() !== '') {
            badgesHtml += `<span class="chip-title">«${escapeHtml(data.title)}»</span>`;
        }

        msgEl.innerHTML = `
            <div class="msg-header">
                ${badgesHtml}
                <span class="user-name" style="color: ${data.color || '#00f0ff'};">${escapeHtml(data.user)}:</span>
            </div>
            <div class="msg-text">${escapeHtml(data.message)}</div>
        `;

        container.appendChild(msgEl);

        while (container.children.length > MAX_MESSAGES) {
            container.removeChild(container.firstChild);
        }

        setTimeout(() => {
            msgEl.classList.add('fade-out');
            setTimeout(() => {
                if (msgEl.parentNode) msgEl.parentNode.removeChild(msgEl);
            }, 500);
        }, MESSAGE_LIFETIME);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    connect();
</script>
</body>
</html>

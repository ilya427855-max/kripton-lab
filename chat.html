<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KRIPTON LAB — Chat Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
        }

        .chat-msg {
            background: rgba(10, 14, 23, 0.94);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-left: 3px solid #00f0ff;
            border-radius: 8px;
            padding: 10px 14px;
            color: #f1f5f9;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 240, 255, 0.08);
            backdrop-filter: blur(6px);
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .chat-msg.fade-out {
            opacity: 0;
            transform: translateX(-20px);
        }

        .msg-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 5px;
            font-size: 12px;
        }

        /* Уровень */
        .chip-lvl {
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        /* Базовый стиль значка */
        .chip-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 1px 7px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            line-height: 1.3;
        }

        /* Титул */
        .chip-title {
            background: rgba(168, 85, 247, 0.18);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.45);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .user-name {
            font-weight: 700;
            font-size: 13px;
        }

        .msg-text {
            word-break: break-word;
            color: #e2e8f0;
            font-size: 13px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div id="chat-container"></div>

<script>
    const WS_URL = "ws://127.0.0.1:8080/";
    const MAX_MESSAGES = 8;
    const MESSAGE_LIFETIME = 20000;

    // Реестр всех 29 значков комплекса KRIPTON LAB
    const BADGE_STYLES = {
        "Золотой след":              { icon: "✨", color: "#ffd700", bg: "rgba(255, 215, 0, 0.18)", border: "rgba(255, 215, 0, 0.5)" },
        "Свой":                      { icon: "🤝", color: "#00f0ff", bg: "rgba(0, 240, 255, 0.18)", border: "rgba(0, 240, 255, 0.5)" },
        "Опора":                     { icon: "🏛️", color: "#10b981", bg: "rgba(16, 185, 129, 0.18)", border: "rgba(16, 185, 129, 0.5)" },
        "500+":                      { icon: "⏳", color: "#f59e0b", bg: "rgba(245, 158, 11, 0.18)", border: "rgba(245, 158, 11, 0.5)" },
        "Хранитель":                 { icon: "🛡️", color: "#3b82f6", bg: "rgba(59, 130, 246, 0.18)", border: "rgba(59, 130, 246, 0.5)" },
        "Архивариус":                { icon: "📜", color: "#eab308", bg: "rgba(234, 179, 8, 0.18)", border: "rgba(234, 179, 8, 0.5)" },
        "Стабильная Нестабильность": { icon: "⚛️", color: "#14b8a6", bg: "rgba(20, 184, 166, 0.18)", border: "rgba(20, 184, 166, 0.5)" },
        "Переменная Найдена":        { icon: "🔍", color: "#8b5cf6", bg: "rgba(139, 92, 246, 0.18)", border: "rgba(139, 92, 246, 0.5)" },
        "Лабораторный Прорыв":       { icon: "💡", color: "#06b6d4", bg: "rgba(6, 182, 212, 0.18)", border: "rgba(6, 182, 212, 0.5)" },
        "Эффект Криптона":           { icon: "💎", color: "#38bdf8", bg: "rgba(56, 189, 248, 0.18)", border: "rgba(56, 189, 248, 0.5)" },
        "Реакция Пошла":             { icon: "🧪", color: "#22c55e", bg: "rgba(34, 197, 94, 0.18)", border: "rgba(34, 197, 94, 0.5)" },
        "Новый Закон":               { icon: "📐", color: "#0ea5e9", bg: "rgba(14, 165, 233, 0.18)", border: "rgba(14, 165, 233, 0.5)" },
        "На Грани":                  { icon: "⚡", color: "#f97316", bg: "rgba(249, 115, 22, 0.18)", border: "rgba(249, 115, 22, 0.5)" },
        "Алхимия Электричества":     { icon: "🔌", color: "#facc15", bg: "rgba(250, 204, 21, 0.18)", border: "rgba(250, 204, 21, 0.5)" },
        "Невозможное Соединение":    { icon: "🌌", color: "#a855f7", bg: "rgba(168, 85, 247, 0.18)", border: "rgba(168, 85, 247, 0.5)" },
        "Великий Эксперимент":       { icon: "⚗️", color: "#c084fc", bg: "rgba(192, 132, 252, 0.18)", border: "rgba(192, 132, 252, 0.5)" },
        "Сотня Сражений":            { icon: "⚔️", color: "#ef4444", bg: "rgba(239, 68, 68, 0.18)", border: "rgba(239, 68, 68, 0.5)" },
        "Мастер Обороны":            { icon: "🏰", color: "#60a5fa", bg: "rgba(96, 165, 250, 0.18)", border: "rgba(96, 165, 250, 0.5)" },
        "Несокрушимый":              { icon: "🗿", color: "#94a3b8", bg: "rgba(148, 163, 184, 0.18)", border: "rgba(148, 163, 184, 0.5)" },
        "Стальной Заслон":           { icon: "🧱", color: "#cbd5e1", bg: "rgba(203, 213, 225, 0.18)", border: "rgba(203, 213, 225, 0.5)" },
        "Пятьсот Тревог":            { icon: "🚨", color: "#f43f5e", bg: "rgba(244, 63, 94, 0.18)", border: "rgba(244, 63, 94, 0.5)" },
        "Хранитель Рубежей":         { icon: "🚩", color: "#ea580c", bg: "rgba(234, 88, 12, 0.18)", border: "rgba(234, 88, 12, 0.5)" },
        "Абсолютный Триумф":         { icon: "🏆", color: "#ffd700", bg: "rgba(255, 215, 0, 0.22)", border: "rgba(255, 215, 0, 0.6)" },
        "Взрывоустойчивый":          { icon: "💥", color: "#fb923c", bg: "rgba(251, 146, 60, 0.18)", border: "rgba(251, 146, 60, 0.5)" },
        "Эврика":                    { icon: "🌟", color: "#fde047", bg: "rgba(253, 224, 71, 0.18)", border: "rgba(253, 224, 71, 0.5)" },
        "Чистый Синтез":             { icon: "💠", color: "#22d3ee", bg: "rgba(34, 211, 238, 0.18)", border: "rgba(34, 211, 238, 0.5)" },
        "Нестабильный":              { icon: "⚠️", color: "#f97316", bg: "rgba(249, 115, 22, 0.18)", border: "rgba(249, 115, 22, 0.5)" },
        "По Протоколу":              { icon: "📋", color: "#38bdf8", bg: "rgba(56, 189, 248, 0.18)", border: "rgba(56, 189, 248, 0.5)" },
        "Под Сирену":                { icon: "🔊", color: "#e11d48", bg: "rgba(225, 29, 72, 0.18)", border: "rgba(225, 29, 72, 0.5)" }
    };

    const container = document.getElementById('chat-container');
    let ws = null;

    function connect() {
        ws = new WebSocket(WS_URL);

        ws.onopen = function () {
            console.log("[WS] Соединение установлено");
        };

        ws.onmessage = function (e) {
            try {
                let raw = JSON.parse(e.data);

                // Рукопожатие со Streamer.bot v1.0.7
                if (raw.request === "Hello") {
                    ws.send(JSON.stringify({
                        request: "Subscribe",
                        id: "kripton-chat-sub",
                        events: { General: ["Custom"], Twitch: ["ChatMessage"] }
                    }));
                    return;
                }

                if (raw.id === "kripton-chat-sub") return;

                // Разбор лабораторного пакета
                let p = raw.data ? (typeof raw.data === 'string' ? JSON.parse(raw.data) : raw.data) : raw;
                if (p.labEvent === "CHAT_MSG" || (p.user && p.message && p.level !== undefined)) {
                    addMessage({
                        user: p.user,
                        color: p.color || "#00f0ff",
                        level: p.level || 1,
                        title: p.title || "",
                        badge: p.badge || "",
                        message: p.message,
                        isMod: p.isMod || false,
                        isSub: p.isSub || false
                    });
                }
            } catch (err) {
                console.error("Ошибка парсинга:", err);
            }
        };

        ws.onclose = function () {
            setTimeout(connect, 2500);
        };

        ws.onerror = function () {
            ws.close();
        };
    }

    function renderBadgeHtml(badgeName) {
        if (!badgeName || badgeName.trim() === '') return '';
        const name = badgeName.trim();
        const conf = BADGE_STYLES[name] || { icon: "🔰", color: "#f59e0b", bg: "rgba(245, 158, 11, 0.18)", border: "rgba(245, 158, 11, 0.45)" };

        return `<span class="chip-badge" style="color: ${conf.color}; background: ${conf.bg}; border: 1px solid ${conf.border}; box-shadow: 0 0 8px ${conf.bg};">
            <span>${conf.icon}</span><span>${escapeHtml(name)}</span>
        </span>`;
    }

    function addMessage(data) {
        const msgEl = document.createElement('div');
        msgEl.className = 'chat-msg';

        let badgesHtml = '';
        if (data.isMod) badgesHtml += '<span title="Модератор">🛡️</span> ';
        if (data.isSub) badgesHtml += '<span title="Подписчик">⭐</span> ';
        badgesHtml += `<span class="chip-lvl">УР.${data.level}</span>`;

        // Индивидуальный значок
        if (data.badge && data.badge.trim() !== '') {
            badgesHtml += ' ' + renderBadgeHtml(data.badge);
        }

        // Титул
        if (data.title && data.title.trim() !== '') {
            badgesHtml += ` <span class="chip-title">«${escapeHtml(data.title)}»</span>`;
        }

        msgEl.innerHTML = `
            <div class="msg-header">
                ${badgesHtml}
                <span class="user-name" style="color: ${data.color};">${escapeHtml(data.user)}:</span>
            </div>
            <div class="msg-text">${escapeHtml(data.message)}</div>
        `;

        container.appendChild(msgEl);

        while (container.children.length > MAX_MESSAGES) {
            container.removeChild(container.firstChild);
        }

        setTimeout(() => {
            msgEl.classList.add('fade-out');
            setTimeout(() => {
                if (msgEl.parentNode) msgEl.parentNode.removeChild(msgEl);
            }, 500);
        }, MESSAGE_LIFETIME);
    }

    function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    connect();
</script>
</body>
</html>
